# Juniper Auto sparse MoE architecture -- FROZEN for v0.1.
#
# Any change to a value in this file changes the architecture identity and
# requires a new `architecture_id` plus a superseding ADR (see docs/adr/).
# Do not edit these values in place to "fix" a mismatch discovered elsewhere
# -- fix the other side, or document a genuine blocker instead.
#
# Schema: juniper_auto.config.schema.ArchitectureConfig

architecture_id: ja150m-v0.1
kind: sparse

core:
  d_model: 512
  n_layers: 20
  # 1-indexed layer numbers using the dense-anchor FFN.
  dense_layers: [1, 5, 10, 15, 20]
  # 1-indexed layer numbers using the MoE FFN. Must partition [1, n_layers]
  # together with dense_layers with no overlap and no gaps.
  moe_layers: [2, 3, 4, 6, 7, 8, 9, 11, 12, 13, 14, 16, 17, 18, 19]

attention:
  kind: causal_gqa
  n_query_heads: 8
  n_kv_heads: 2
  head_dim: 64
  qk_norm: true
  qk_norm_placement: before_rope
  qk_norm_kind: per_head_rmsnorm
  attention_scale: 0.125
  context_length: 4096
  future_context_target: 16384
  future_context_advertised: false
  sliding_window: null
  attention_bias: false
  causal: true

dense_ffn:
  kind: swiglu
  dim: 1536
  expansion: 3.0
  bias: false

moe:
  n_routed_experts: 8
  n_shared_experts: 1
  top_k: 2
  shared_expert_always_active: true
  expert_ffn_dim: 512
  router_bias: false
  router_input_dim: 512
  router_output_dim: 8
  router_logits_dtype: fp32
  router_softmax_dtype: fp32
  routing_kind: token_choice
  dropless: true
  token_dropping_allowed: false
  renormalize_top_k_weights: true
  load_balance_loss_coefficient: 0.01
  router_z_loss_coefficient: 0.001
  training_router_jitter: true
  inference_router_jitter: false

normalization:
  kind: rmsnorm
  placement: pre_norm
  epsilon: 1.0e-5
  reduction_dtype: fp32

position_encoding:
  kind: rope
  theta: 100000
  initial_scaling: 1.0
  rotary_dim: 64

residual:
  kind: additive
  scale: 1.0
  rezero: false
  deepnorm: false
  learned_gates: false

embeddings:
  kind: learned
  vocab_size: 36864
  dim: 512
  tie_lm_head: true
  output_bias: false
  embedding_scale: 1.0
  logit_softcap: null

dropout:
  embedding: 0.0
  attention: 0.0
  ffn: 0.0
  residual: 0.0

initialization:
  distribution: normal
  mean: 0.0
  base_std: 0.02
  router_std: 0.02
  embedding_std: 0.02
  # 0.02 / sqrt(2 * n_layers) = 0.02 / sqrt(40)
  residual_output_projection_std: 0.0031622776601683794

precision:
  # Policy only -- Phase 0 does not implement training. See docs/research/project-charter.md.
  training_mixed_precision: fp16
  training_param_master_dtype: fp32
  inference_default_dtype: fp16
