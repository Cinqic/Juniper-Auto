- experiment_id: exp-0002
  date: "2026-08-25"
  phase: phase-0
  hypothesis: >
    FoundationProbe (a minimal tensor pipeline, not the Juniper Auto model)
    produces bitwise-identical output under a fixed seed on CPU, and
    different output under a different seed, proving the seed framework in
    juniper_auto.util.seed actually has an effect and that determinism can
    be checked mechanically before any real model exists.
  git_commit: 88b4ed452dd477849b4041137130f52cc814fb5b
  architecture_id: ja150m-v0.1
  tokenizer_id: not-yet-created
  dataset_id: not-yet-created
  sampler_id: not-applicable
  starting_checkpoint: not-applicable
  configuration: configs/architecture/ja150m-v0.1.yaml
  seed: 42 (and 1, 2 for the cross-seed comparison)
  environment: see docs/architecture/environment-specification.md
  token_budget: not-applicable
  status: completed
  result: >
    Same-seed runs (seed=42) on CPU produced identical output checksums
    across repeated invocations. Different-seed runs (seed=1 vs seed=2)
    produced different checksums. See tests/test_determinism.py.
  conclusion: >
    Best-effort CPU determinism holds for the foundation probe under this
    seed framework. CUDA-side bitwise determinism was not claimed or
    tested here -- see juniper_auto/util/seed.py's strict_determinism_claim
    field and docs/phases/phase-0-sonnet-self-review.md for the accepted
    limitation.
  artifact_locations: tests/test_determinism.py, juniper_auto/foundation/probe.py

