- experiment_id: exp-0006
  date: "2026-08-25"
  phase: phase-1
  hypothesis: >
    Resuming the full official ja150m-v0.1 model's training from a
    mid-run checkpoint (model, optimizer, RNG streams, sampler/data-stream
    position, step counters) reproduces, on a deterministic CPU
    configuration, exactly the same subsequent batches, losses, and final
    parameters as an uninterrupted run -- proving checkpoint/resume is not
    merely "loads without crashing" but numerically equivalent.
  git_commit: 241295a2fc99a0289bace5ca734d600090a84f53
  architecture_id: ja150m-v0.1
  tokenizer_id: not-yet-created
  dataset_id: synthetic Phase 1 engineering data (SyntheticSequenceStream, seed 42, 6 sequences x 16 tokens, vocab 36,864)
  sampler_id: SyntheticSequenceStream (seed 42, batch_size 2)
  starting_checkpoint: mid-run checkpoint saved by this experiment itself at step 10 (not a prior release checkpoint -- none exists yet)
  configuration: configs/architecture/ja150m-v0.1.yaml
  seed: 42
  environment: FLOWBOX, CPU (deterministic-comparison run; CUDA bitwise determinism is not claimed per juniper_auto.util.seed), AdamW lr=1e-3, 20 steps total, split at step 10
  token_budget: not-applicable
  status: completed
  result: >
    Run A (uninterrupted, 20 steps) vs Run B (10 steps, checkpoint,
    harness discarded, reconstructed from the checkpoint's recorded
    training config, resumed for 10 more steps): steps 11-20 losses
    matched exactly (bit-for-bit, atol=0/rtol=0), final parameters
    matched exactly (max abs diff 0.0), AdamW exp_avg/exp_avg_sq matched
    exactly, global_step and global_valid_token_count matched. Full
    result: docs/experiments/results/exp-0006-checkpoint-resume-equivalence.json.
  conclusion: >
    Checkpoint/resume is exactly equivalent to uninterrupted training on
    this deterministic CPU configuration for the full 150M-parameter
    sparse model. tests/test_training_resume_equivalence.py additionally
    proves this result is load-bearing (not a vacuous same-seed
    coincidence) via two negative controls that correctly diverge.
  artifact_locations: docs/experiments/results/exp-0006-checkpoint-resume-equivalence.json, tests/test_training_resume_equivalence.py, juniper_auto/training/checkpoint.py

- experiment_id: exp-0007
  date: "2026-08-25"
  phase: phase-1
  hypothesis: >
    The full official ja150m-v0.1-dense architecture has a practical,
    measured FLOWBOX (RTX 2060 6GB) execution profile for inference
    (FP32/FP16), a training step (forward/backward/optimizer separately
    timed), checkpoint I/O, and a full-context (4,096 token, batch-1)
    reference inference pass -- not a theoretical estimate.
  git_commit: 241295a2fc99a0289bace5ca734d600090a84f53
  architecture_id: ja150m-v0.1-dense
  tokenizer_id: not-yet-created
  dataset_id: synthetic Phase 1 engineering data (random token ids, not a real corpus)
  sampler_id: not-applicable
  starting_checkpoint: not-applicable
  configuration: configs/architecture/ja150m-v0.1-dense.yaml
  seed: 0
  environment: FLOWBOX (Ryzen 7 5700G, RTX 2060 6GB, torch 2.13.0+cu130, CUDA driver 13.0)
  token_budget: not-applicable
  status: completed
  result: >
    Inference (batch=1, seq=512, warmup=3, measured=10): FP32 17,191
    tok/s (401.9 MB peak VRAM), FP16 27,574 tok/s (285.9 MB peak VRAM).
    Training step (microbatch=2, seq=512, grad_accum=4, FP16 AMP):
    forward 0.123s, backward 0.247s, optimizer 0.028s, total 0.398s,
    10,292 training tok/s, 2.79 GB peak VRAM. Checkpoint I/O: 950.6 MB
    file, write 2.69s, load 0.34s. Full-context probe (batch=1, seq=4096,
    FP16): succeeded, 1.09 GB peak VRAM. Full result:
    docs/experiments/results/exp-0007-flowbox-dense-profile.json.
  conclusion: >
    The dense control comfortably fits FLOWBOX's 6 GB VRAM budget at
    these settings, including full 4,096-token batch-1 inference. FP16
    gives a clear ~1.6x inference throughput improvement over FP32 for
    this dense architecture.
  artifact_locations: docs/experiments/results/exp-0007-flowbox-dense-profile.json, juniper_auto/training/profiling.py, scripts/run_phase1_experiment.py

- experiment_id: exp-0008
  date: "2026-08-25"
  phase: phase-1
  hypothesis: >
    The full official ja150m-v0.1 sparse MoE architecture has a practical,
    measured FLOWBOX execution profile under the same methodology as
    exp-0007, and a full-context (4,096 token, batch-1) reference
    inference pass succeeds or fails honestly on this hardware.
  git_commit: 241295a2fc99a0289bace5ca734d600090a84f53
  architecture_id: ja150m-v0.1
  tokenizer_id: not-yet-created
  dataset_id: synthetic Phase 1 engineering data (random token ids, not a real corpus)
  sampler_id: not-applicable
  starting_checkpoint: not-applicable
  configuration: configs/architecture/ja150m-v0.1.yaml
  seed: 0
  environment: FLOWBOX (Ryzen 7 5700G, RTX 2060 6GB, torch 2.13.0+cu130, CUDA driver 13.0)
  token_budget: not-applicable
  status: completed
  result: >
    Inference (batch=1, seq=512, warmup=3, measured=10): FP32 5,011
    tok/s (685.2 MB peak VRAM), FP16 5,113 tok/s (423.5 MB peak VRAM) --
    FP16 gives almost no inference speedup here, unlike the dense model,
    because the reference dropless MoE dispatch loops over 8 experts per
    layer in Python and is kernel-launch/overhead-bound rather than
    compute-bound at batch=1 (an expected property of the Phase 1
    reference implementation; batched/fused MoE dispatch is Phase 2
    scope). Training step (microbatch=2, seq=512, grad_accum=4, FP16
    AMP): forward 0.520s, backward 0.749s, optimizer 0.054s, total
    1.323s, 3,096 training tok/s, 4.19 GB peak VRAM. Checkpoint I/O:
    1.62 GB file, write 5.86s, load 0.69s. Full-context probe (batch=1,
    seq=4096, FP16): succeeded, 1.23 GB peak VRAM. Full result:
    docs/experiments/results/exp-0008-flowbox-sparse-profile.json.

    An earlier run of this experiment (same commit) hit a CUDA OOM during
    the checkpoint-I/O stage; investigation traced it to the profiling
    script not releasing the prior training-step model/optimizer's GPU
    memory before building a second full model for the checkpoint probe
    -- a profiling-script memory-hygiene bug, not an architecture or
    hardware limitation. Fixed in scripts/run_phase1_experiment.py
    (explicit del + torch.cuda.empty_cache() between stages) and rerun
    to the clean result above; the failed run's cause is recorded here
    rather than silently discarded.
  conclusion: >
    The sparse model also fits FLOWBOX's 6 GB VRAM budget at these
    settings, including full 4,096-token batch-1 inference, with headroom
    to spare. The reference (unoptimized) MoE dispatch is a real,
    honestly-measured throughput ceiling for Phase 1 -- optimizing it is
    explicitly Phase 2 scope, not something to paper over here.
  artifact_locations: docs/experiments/results/exp-0008-flowbox-sparse-profile.json, juniper_auto/training/profiling.py, scripts/run_phase1_experiment.py

