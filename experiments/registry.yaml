- experiment_id: exp-0004
  date: "2026-08-25"
  phase: phase-1
  hypothesis: >
    The full official ja150m-v0.1-dense architecture, trained end to end
    (forward, backward, AdamW, gradient clipping, FP16 AMP + dynamic
    GradScaler) on a tiny deterministic synthetic token dataset, can
    memorize it -- unambiguous evidence the training plumbing is wired
    correctly, not merely that the architecture is mathematically
    plausible on paper.
  git_commit: 241295a2fc99a0289bace5ca734d600090a84f53
  architecture_id: ja150m-v0.1-dense
  tokenizer_id: not-yet-created
  dataset_id: synthetic Phase 1 engineering data (juniper_auto.training.state.SyntheticSequenceStream, seed 1234, 8 sequences x 32 tokens, vocab 36,864)
  sampler_id: SyntheticSequenceStream (seed 1234, batch_size 4)
  starting_checkpoint: not-applicable
  configuration: configs/architecture/ja150m-v0.1.yaml (dense control)
  seed: 1234
  environment: FLOWBOX (Ryzen 7 5700G, RTX 2060 6GB, torch 2.13.0+cu130, CUDA), AdamW lr=3e-3, grad_clip_norm=1.0, 300 steps, FP16 AMP
  token_budget: not-applicable (tiny-batch memorization gate, not pretraining)
  status: completed
  result: >
    LM loss 10.60 -> 0.0012 (best 0.0012), token accuracy 100% by the end
    of the run, zero non-finite (NaN/Inf) events across all 300 steps,
    elapsed 28.5s, peak VRAM 1.67 GB. Full result:
    docs/experiments/results/exp-0004-dense-tiny-overfit.json.
  conclusion: >
    The dense control's full training path (forward/backward/optimizer/
    AMP/grad-clipping) is functionally correct and can memorize a tiny
    deterministic target on real FLOWBOX hardware.
  artifact_locations: docs/experiments/results/exp-0004-dense-tiny-overfit.json, juniper_auto/training/tiny_overfit.py, scripts/run_phase1_experiment.py

