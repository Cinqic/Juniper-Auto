name: Phase 0 Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate repository (CPU-only, clean Linux runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies from locked requirements
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Install project package (editable, no re-resolve)
        run: |
          source .venv/bin/activate
          pip install -e . --no-deps

      - name: Run canonical Phase 0 validation (imports, config, accounting, hashes, integrity, determinism, tests)
        run: |
          source .venv/bin/activate
          python scripts/validate_repo.py --all
