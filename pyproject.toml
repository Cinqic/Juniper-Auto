[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juniper-auto"
version = "0.0.1"
description = "Retired Cinqic research archive for a ~150M-parameter sparse MoE causal language model."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Cinqic" }]

# Canonical Phase 0 runtime dependency set. Kept intentionally small: Phase 0
# builds configuration, accounting, and a deterministic foundation probe --
# not the model itself. New dependencies require an ADR (docs/adr/).
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "torch>=2.3,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pip-tools>=7.4,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["juniper_auto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
