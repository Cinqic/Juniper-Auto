# Juniper Auto frozen artifact registry.
#
# status is one of: frozen, planned, not-yet-created, superseded.
# A `status: frozen` artifact should have a corresponding entry in
# manifests/phase-0-artifact-hashes.yaml (or its later-phase successor).
# Do not invent hashes for artifacts that are not yet frozen -- see
# docs/research/project-governance.md, rule 38.

architecture:
  sparse:
    id: ja150m-v0.1
    status: frozen
    location: configs/architecture/ja150m-v0.1.yaml
    notes: >
      Frozen for v0.1. See docs/research/project-charter.md and
      docs/adr/0001-one-model-moe-architecture.md.
  dense_baseline:
    id: ja150m-v0.1-dense
    status: frozen
    location: configs/architecture/ja150m-v0.1-dense.yaml
    notes: >
      Mandatory dense control, frozen alongside the sparse architecture.
      See docs/adr/0002-dense-control-requirement.md.

reference_model_implementation:
  id: ja150m-v0.1-reference-implementation
  status: frozen
  location: juniper_auto/model/, juniper_auto/training/
  notes: >
    Phase 1 executable PyTorch reference implementation of the frozen
    ja150m-v0.1 / ja150m-v0.1-dense architectures (forward/backward,
    losses, checkpointing, tiny-overfit harness, profiling). Hash-tracked
    via manifests/phase-1-artifact-hashes.yaml. This is architecture and
    training plumbing, not a trained checkpoint -- base_checkpoint and
    instruction_checkpoint below remain not-yet-created, and no language
    capability is claimed.

checkpoint_format:
  id: juniper-auto-checkpoint-v1
  status: frozen
  location: juniper_auto/training/checkpoint.py
  notes: >
    Versioned training checkpoint format (CHECKPOINT_FORMAT_VERSION=1),
    validated in juniper_auto/training/checkpoint.py. Governs the shape of
    any checkpoint this project writes; not itself a trained checkpoint.

tokenizer:
  status: not-yet-created
  target_vocab_size: 36864
  notes: Tokenizer training is Phase 3 scope, not Phase 0.

special_token_map:
  status: not-yet-created
  notes: Depends on the tokenizer (Phase 3).

runtime_protocol:
  status: not-yet-created
  notes: Runtime protocol design is Phase 4 scope.

tool_schemas:
  status: not-yet-created
  notes: Depends on the runtime protocol (Phase 4).

memory_schema:
  status: not-yet-created
  notes: >
    configs/memory/ directory exists as a placeholder for future schema
    work; no schema has been designed yet.

state_schema:
  status: not-yet-created
  notes: Runtime state schema is Phase 4 scope.

permission_policy:
  status: not-yet-created
  notes: >
    docs/research/project-governance.md rules 17-19 state the operational
    requirements a future permission policy must satisfy; the policy
    itself does not exist yet.

pretraining_dataset:
  status: not-yet-created
  target: "~4-5B unique approved tokens, ~6B effective exposures"
  notes: Unified pretraining data acquisition/curation is Phase 6 scope. See project-charter.md.

post_training_dataset:
  status: not-yet-created
  target: "~100-300M curated tokens"
  notes: Post-training data is prepared for Phases 10-11.

evaluation_suite:
  status: not-yet-created
  notes: >
    evals/ directory exists as a placeholder; the evaluation harness that
    would run both ja150m-v0.1 and ja150m-v0.1-dense through the same
    tests is Phase 5 scope.

training_precision_policy:
  id: ja150m-v0.1-precision-policy
  status: frozen
  location: docs/architecture/precision-policy.md
  notes: Phase 0 policy target; no training implementation or result is claimed.

base_checkpoint:
  status: not-yet-created
  notes: No pretraining has occurred.

instruction_checkpoint:
  status: not-yet-created
  notes: No post-training has occurred.

autonomous_system_release:
  status: not-yet-created
  notes: Runtime/autonomy work has not started. See v0.1 non-goals in project-charter.md.
